<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="72" height="72" rx="14" fill="url(#bg)"/>
  <!-- Vertical arm of cross -->
  <rect x="29.5" y="16" width="13" height="40" rx="4" fill="url(#cross)"/>
  <!-- Horizontal arm of cross -->
  <rect x="16" y="29.5" width="40" height="13" rx="4" fill="url(#cross)"/>
  <!-- Small Rx text mark for pharmacy identity -->
  <text x="63" y="67" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="end" opacity="0.85">Rx</text>
</svg>