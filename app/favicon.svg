<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Vertical arm of cross -->
  <rect x="13" y="7" width="6" height="18" rx="2" fill="url(#cross)"/>
  <!-- Horizontal arm of cross -->
  <rect x="7" y="13" width="18" height="6" rx="2" fill="url(#cross)"/>
  <!-- Small Rx text mark for pharmacy identity -->
  <text x="27" y="31" font-family="system-ui,sans-serif" font-size="4" font-weight="700" fill="white" text-anchor="end" opacity="0.85">Rx</text>
</svg>