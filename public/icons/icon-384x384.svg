<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="384" height="384" rx="77" fill="url(#bg)"/>
  <!-- Vertical arm of cross -->
  <rect x="157.5" y="86.5" width="69" height="211" rx="21" fill="url(#cross)"/>
  <!-- Horizontal arm of cross -->
  <rect x="86.5" y="157.5" width="211" height="69" rx="21" fill="url(#cross)"/>
  <!-- Small Rx text mark for pharmacy identity -->
  <text x="344" y="348" font-family="system-ui,sans-serif" font-size="50" font-weight="700" fill="white" text-anchor="end" opacity="0.85">Rx</text>
</svg>