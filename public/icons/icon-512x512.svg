<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  <!-- Vertical arm of cross -->
  <rect x="210" y="115" width="92" height="282" rx="28" fill="url(#cross)"/>
  <!-- Horizontal arm of cross -->
  <rect x="115" y="210" width="282" height="92" rx="28" fill="url(#cross)"/>
  <!-- Small Rx text mark for pharmacy identity -->
  <text x="459" y="463" font-family="system-ui,sans-serif" font-size="67" font-weight="700" fill="white" text-anchor="end" opacity="0.85">Rx</text>
</svg>