<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="96" height="96" rx="19" fill="url(#bg)"/>
  <!-- Vertical arm of cross -->
  <rect x="39.5" y="21.5" width="17" height="53" rx="5" fill="url(#cross)"/>
  <!-- Horizontal arm of cross -->
  <rect x="21.5" y="39.5" width="53" height="17" rx="5" fill="url(#cross)"/>
  <!-- Small Rx text mark for pharmacy identity -->
  <text x="84" y="88" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="end" opacity="0.85">Rx</text>
</svg>