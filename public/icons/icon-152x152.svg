<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 152 152">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="152" height="152" rx="30" fill="url(#bg)"/>
  <!-- Vertical arm of cross -->
  <rect x="62.5" y="34" width="27" height="84" rx="8" fill="url(#cross)"/>
  <!-- Horizontal arm of cross -->
  <rect x="34" y="62.5" width="84" height="27" rx="8" fill="url(#cross)"/>
  <!-- Small Rx text mark for pharmacy identity -->
  <text x="135" y="139" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="end" opacity="0.85">Rx</text>
</svg>